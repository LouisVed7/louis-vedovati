    <section class="page">
      <h1>Contactez-moi</h1>
      <!-- Remplace VOTRE_ID par l'identifiant de ton formulaire Formspree (voir les explications) -->
      <form id="contact-form" class="form" action="https://formspree.io/f/VOTRE_ID" method="POST">
        <label>Nom <input type="text" name="nom" required autocomplete="name"></label>
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        <label>Message <textarea name="message" required></textarea></label>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Envoyer</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
