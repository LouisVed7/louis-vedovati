            <h1>CONTACT</h1>
            <p class="contact-intro">N'hésitez pas à m'envoyer un message pour toute demande de renseignement ou collaboration.</p>
            
            <!-- Remplacez "VOTRE_EMAIL" dans l'URL formspree.io une fois votre compte créé, 
                 ou mettez un simple lien mailto:votre@email.com -->
            <form action="https://formspree.io/f/VOTRE_ID_FORMSPREE" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Envoyer</button>
            </form>
        </section>
    </main>
